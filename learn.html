<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learning Q&amp;A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="quiz.css" />
    <style>
      /* Learning mode: each question locks and shows its answer as soon as one option is picked. */
      fieldset:has(:checked) label {
        pointer-events: none;
        box-shadow: none;
      }
      fieldset:has(:checked) label:has(.ok) {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      fieldset:has(:checked) label:has(.ok)::after {
        content: "✓";
        margin-left: auto;
        color: var(--ok);
        font-weight: 700;
      }
      fieldset:has(:checked) label:has(input:checked:not(.ok)) {
        border-color: var(--bad);
        background: var(--bad-bg);
      }
      fieldset:has(:checked) label:has(input:checked:not(.ok))::after {
        content: "✗";
        margin-left: auto;
        color: var(--bad);
        font-weight: 700;
      }
      fieldset:has(:checked) .explain {
        display: block;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .options label {
        margin: 0;
        padding: 6px 12px;
      }
      .options input {
        margin-top: 0.3em;
      }
      .result .answered {
        margin-right: auto;
      }
      /* quiz.css hides the score until "Show results"; here it is live. */
      form#quiz .result > span:has(.score) {
        display: inline;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header id="head">
      <p class="eyebrow">Digital Marketing for Business · Learning Q&amp;A</p>
      <h1>Loading…</h1>
    </header>

    <div class="options">
      <label
        ><input type="checkbox" id="shuffle-q" /> Random questions ·
        សំណួរចៃដន្យ</label
      >
      <label
        ><input type="checkbox" id="shuffle-o" /> Random options ·
        ជម្រើសចៃដន្យ</label
      >
    </div>

    <form id="quiz">
      <div class="result">
        <span>Score · ពិន្ទុ <b class="score"></b></span>
        <span class="answered"></span>
        <button type="reset">Restart · ចាប់ផ្តើមឡើងវិញ</button>
      </div>
    </form>

    <footer id="foot"></footer>

    <script>
      // ponytail: reads questions straight from the chapter's quiz page, so the two never drift apart.
      // fetch() needs http(s); opened as file:// it fails — use GitHub Pages or `npx serve`.
      const form = document.getElementById("quiz");
      const bar = form.querySelector(".result");
      const shuffleQ = document.getElementById("shuffle-q");
      const shuffleO = document.getElementById("shuffle-o");
      const path = new URLSearchParams(location.search).get("quiz") || "";
      let questions = [];

      const shuffled = (list) => {
        const a = [...list];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      function arrange() {
        for (const q of shuffleQ.checked ? shuffled(questions) : questions) {
          const labels = shuffleO.checked ? shuffled(q.labels) : q.labels;
          q.el.querySelector(".explain").before(...labels);
          form.insertBefore(q.el, bar); // bar must stay last for the CSS counters
        }
      }

      async function load() {
        // Only same-site relative quiz pages, e.g. Ch1_x/Ch1_Quiz.html
        if (!/^[\w .%-]+\/Ch\d+_[\w]*Quiz\.html$/.test(path))
          throw new Error("Missing or invalid ?quiz= parameter");
        const res = await fetch(path);
        if (!res.ok) throw new Error(res.status + " " + path);
        const doc = new DOMParser().parseFromString(
          await res.text(),
          "text/html"
        );
        const head = document.getElementById("head");
        head.querySelector("h1").textContent =
          doc.querySelector("h1").textContent;
        head.querySelector(".eyebrow").textContent =
          doc.querySelector(".eyebrow").textContent + " · Learning Q&A";
        head.insertAdjacentHTML(
          "beforeend",
          `<p class="hint">Pick an option to see the answer right away. Prefer a scored test? <a href="${path}">Take the quiz</a>.</p>`
        );
        document.title =
          doc.querySelector("title").textContent + " · Learning Q&A";
        document.getElementById("foot").textContent =
          doc.querySelector("footer")?.textContent || "";

        questions = [...doc.querySelectorAll("fieldset")].map((f) => {
          const el = document.importNode(f, true);
          return { el, labels: [...el.querySelectorAll("label")] };
        });
        form.style.setProperty("--total", `"${questions.length}"`);
        arrange();
      }

      shuffleQ.onchange = shuffleO.onchange = arrange;
      form.onreset = () => setTimeout(arrange); // reshuffle after the browser clears answers

      load().catch((e) => {
        document.querySelector("h1").textContent = "Could not load questions";
        form.insertAdjacentHTML("beforebegin", `<p class="hint"></p>`);
        form.previousElementSibling.textContent = e.message;
      });
    </script>
  </body>
</html>
